
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LostMatch | My Reports</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f6f4fb;
    color: #17132e;
    display: flex;
    justify-content: center;
}

.app {
    width: 390px;
    max-width: 100%;
    min-height: 844px;
    margin: 30px auto;
    background: #fcfaff;
    border: 3px solid #8b83a5;
    border-radius: 48px;
    overflow: hidden;
    position: relative;
    box-shadow: 0 8px 25px rgba(0,0,0,.15);
}

.phone-notch {
    width: 125px;
    height: 30px;
    background: #25212e;
    border-radius: 25px;
    margin: 12px auto 0;
}

.content {
    padding: 25px 18px 115px;
}

.header {
    position: relative;
    text-align: center;
    margin-bottom: 42px;
}

.header h1 {
    font-size: 24px;
    margin: 0;
}

.back {
    position: absolute;
    left: 0;
    top: -8px;
    font-size: 35px;
    color: #17132e;
    text-decoration: none;
}

.tabs {
    display: flex;
    padding: 4px;
    background: #f8f5fc;
    border: 1px solid #e4d9ef;
    border-radius: 18px;
    margin-bottom: 22px;
}

.tab {
    flex: 1;
    min-width: 0;
    padding: 13px 5px;
    border: none;
    border-radius: 15px;
    background: transparent;
    color: #241538;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
}

.tab.active {
    color: white;
    background: linear-gradient(180deg,#a45bd6,#61249c);
}

.reports-list {
    display: flex;
    flex-direction: column;
    gap: 13px;
}

.report-card {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px;
    background: #f8f4fc;
    border: 1px solid #eee7f7;
    border-radius: 23px;
    box-shadow: 0 3px 8px rgba(78,42,115,.08);
    text-align: left;
    cursor: pointer;
    color: inherit;
    font-family: inherit;
}

.report-card:hover {
    background: #f0e7fa;
}

.report-image {
    width: 94px;
    height: 94px;
    border-radius: 15px;
    object-fit: cover;
    background: #eae2f1;
    flex-shrink: 0;
}

.no-photo {
    width: 94px;
    height: 94px;
    flex-shrink: 0;
    border-radius: 15px;
    background: #eae2f1;
    color: #8b75a3;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 12px;
    text-align: center;
}

.report-info {
    min-width: 0;
    flex: 1;
}

.report-info h3 {
    font-size: 17px;
    margin: 0 0 7px;
    overflow-wrap: anywhere;
}

.report-date {
    margin: 0 0 10px;
    color: #5b5267;
    font-size: 13px;
}

.status {
    display: inline-block;
    padding: 7px 16px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.searching {
    color: #a44c18;
    background: #ffddc7;
}

.matched {
    color: #216a38;
    background: #c8f4d0;
}

.closed {
    color: #3e3a4b;
    background: #e6e2ec;
}

.arrow {
    font-size: 30px;
    color: #17132e;
    flex-shrink: 0;
}

.empty {
    text-align: center;
    padding: 40px 10px;
    color: #756b80;
    font-size: 14px;
    line-height: 1.6;
}

.bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background: white;
    border-top: 1px solid #eee5f6;
    display: flex;
    justify-content: space-around;
    padding: 15px 5px 20px;
}

.nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    color: #332c45;
    text-decoration: none;
    font-size: 12px;
}

.nav-item svg {
    width: 25px;
    height: 25px;
}

.nav-item.active {
    color: #7b25c5;
    font-weight: bold;
}

@media (max-width:430px) {
    .app {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        border: none;
        border-radius: 0;
    }

    .bottom-nav {
        position: fixed;
    }
}
</style>
</head>

<body>
<div class="app">

    <div class="phone-notch"></div>

    <main class="content">

        <header class="header">
            <a class="back"
               href="{{ url_for('dashboard') }}"
               aria-label="Back to Home">‹</a>
            <h1>My Reports</h1>
        </header>

        <div class="tabs">
            <button class="tab"
                    id="lostTab" type="button">
                Lost Reports ({{ reports.lost | length }})
            </button>

            <button class="tab"
                    id="foundTab" type="button">
                Found Reports ({{ reports.found | length }})
            </button>
        </div>

        <section class="reports-list"
                 id="reportsList"></section>

    </main>

    <nav class="bottom-nav">

        <a href="{{ url_for('dashboard') }}"
           class="nav-item">
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">
                <path d="M3 11L12 3l9 8v10h-7v-7h-4v7H3z"/>
            </svg>
            Home
        </a>

        <a href="{{ url_for('my_reports') }}"
           class="nav-item active">
            <svg viewBox="0 0 24 24"
                 fill="currentColor">
                <rect x="5" y="3"
                      width="14" height="18" rx="2"/>
                <path d="M8 8h8M8 12h8M8 16h6"
                      stroke="white"
                      stroke-width="1.5"/>
            </svg>
            Reports
        </a>

        <a href="{{ url_for('my_matches') }}" class="nav-item">
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">
                <path d="M20 9c0 6-8 12-8 12S4 15 4 9a5 5 0 0 1 8-4 5 5 0 0 1 8 4z"/>
            </svg>
            Matches
        </a>

        <a href="#" class="nav-item">
            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2">
                <circle cx="12" cy="7" r="4"/>
                <path d="M4 21c0-5 3-8 8-8s8 3 8 8"/>
            </svg>
            Profile
        </a>

    </nav>
</div>

<script id="reportsData" type="application/json">
    {{ reports | tojson }}
</script>

<script id="selectedTypeData" type="application/json">
    {{ selected_type | tojson }}
</script>

<script>
const reports = JSON.parse(
    document.getElementById("reportsData").textContent
);

const selectedType = JSON.parse(
    document.getElementById("selectedTypeData").textContent
);

const lostTab = document.getElementById("lostTab");
const foundTab = document.getElementById("foundTab");
const reportsList = document.getElementById("reportsList");

function renderReports(type) {
    lostTab.classList.toggle("active", type === "lost");
    foundTab.classList.toggle("active", type === "found");

    reportsList.innerHTML = "";

    const currentReports = reports[type];

    if (currentReports.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent =
            "No " + type + " reports yet. Your submitted reports will appear here.";
        reportsList.appendChild(empty);
        return;
    }

    currentReports.forEach(report => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "report-card";

        let imageElement;

        if (report.image) {
            imageElement = document.createElement("img");
            imageElement.className = "report-image";
            imageElement.src = report.image;
            imageElement.alt = report.name;
        } else {
            imageElement = document.createElement("div");
            imageElement.className = "no-photo";
            imageElement.textContent = "No Photo";
        }

        const info = document.createElement("div");
        info.className = "report-info";

        const title = document.createElement("h3");
        title.textContent = report.name;

        const date = document.createElement("p");
        date.className = "report-date";

        const dateValue = new Date(report.date + "T00:00:00");

        date.textContent = isNaN(dateValue.getTime())
            ? report.date
            : dateValue.toLocaleDateString("en-US", {
                month: "short",
                day: "numeric",
                year: "numeric"
            });

        const status = document.createElement("span");
        status.className =
            "status " + report.status.toLowerCase();

        status.textContent = report.status;

        const arrow = document.createElement("span");
        arrow.className = "arrow";
        arrow.textContent = "›";

        info.append(title, date, status);
        card.append(imageElement, info, arrow);

        card.addEventListener("click", () => {
            window.location.href = "/report-details/" + report.id;
        }); 
        reportsList.appendChild(card);
    });
}

lostTab.addEventListener("click", () => {
    renderReports("lost");
});

foundTab.addEventListener("click", () => {
    renderReports("found");
});

renderReports(selectedType);
</script>

</body>
</html>
