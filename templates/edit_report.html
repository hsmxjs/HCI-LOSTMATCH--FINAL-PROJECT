
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LostMatch | Edit Report</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f6f4fb;
    color: #17132e;
    display: flex;
    justify-content: center;
}

.app {
    width: 390px;
    max-width: 100%;
    min-height: 844px;
    margin: 30px auto;
    padding: 45px 23px;
    background: #fcfaff;
    border: 3px solid #8b83a5;
    border-radius: 48px;
}

h1 { text-align: center; font-size: 23px; }

.back {
    color: #17132e;
    font-size: 30px;
    text-decoration: none;
}

.field { margin: 18px 0; }

label {
    display: block;
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 14px;
}

input, select, textarea {
    width: 100%;
    padding: 13px;
    border: 1px solid #dcd3eb;
    border-radius: 12px;
    font-family: inherit;
    font-size: 14px;
}

textarea { min-height: 95px; }

.submit {
    width: 100%;
    padding: 16px;
    margin-top: 20px;
    border: none;
    border-radius: 17px;
    color: white;
    font-weight: bold;
    font-size: 17px;
    cursor: pointer;
    background: linear-gradient(180deg,#a45bd6,#61249c);
}

.error { color: #c42c35; }

@media(max-width:430px) {
    .app {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        border: none;
        border-radius: 0;
    }
}
</style>
</head>

<body>
<div class="app">
    <a class="back"
       href="{{ url_for('report_details', report_id=report.id) }}">‹</a>

    <h1>Edit Report</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <div class="field">
            <label>Item Name *</label>
            <input name="item_name"
                   value="{{ report.item_name }}"
                   required>
        </div>

        <div class="field">
            <label>Category *</label>
            <select name="category" required>
                {% for category in categories %}
                    <option value="{{ category }}"
                        {% if category == report.category %}selected{% endif %}>
                        {{ category }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label>Color</label>
            <select name="color">
                {% for color in ['White', 'Black', 'Purple', 'Blue', 'Pink'] %}
                    <option value="{{ color }}"
                        {% if color == report.color %}selected{% endif %}>
                        {{ color }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label>
                {{ 'Last Seen Location' if report.report_type == 'lost' else 'Found Location' }}
            </label>
            <input name="location"
                   value="{{ report.location }}"
                   required>
        </div>

        <div class="field">
            <label>
                {{ 'Date Lost' if report.report_type == 'lost' else 'Date Found' }}
            </label>
            <input type="date"
                   name="report_date"
                   value="{{ report.report_date }}"
                   required>
        </div>

        <div class="field">
            <label>Description</label>
            <textarea name="description">{{ report.description or '' }}</textarea>
        </div>

        <button type="submit" class="submit">
            Save Changes
        </button>
    </form>
</div>
</body>
</html>
