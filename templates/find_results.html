
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LostMatch | Find Item Results</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f6f4fb;
    color: #17132e;
    display: flex;
    justify-content: center;
}

.app {
    width: 390px;
    max-width: 100%;
    min-height: 844px;
    margin: 30px auto;
    background: #fcfaff;
    border: 3px solid #8b83a5;
    border-radius: 48px;
    overflow: hidden;
    box-shadow: 0 8px 25px rgba(0,0,0,.15);
}

.phone-notch {
    width: 125px;
    height: 30px;
    background: #25212e;
    border-radius: 25px;
    margin: 12px auto 0;
}

.content {
    padding: 25px 20px 40px;
}

.header {
    position: relative;
    text-align: center;
    margin-bottom: 48px;
}

.header h1 {
    font-size: 22px;
    margin: 0;
}

.back {
    position: absolute;
    left: 0;
    top: -8px;
    font-size: 35px;
    text-decoration: none;
    color: #17132e;
}

.results-title {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 24px;
}

.results-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.result-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    background: #f6f2fa;
    border-radius: 18px;
    min-height: 110px;
}

.result-image {
    width: 92px;
    height: 92px;
    flex-shrink: 0;
    object-fit: cover;
    border-radius: 13px;
    background: #e9e0f2;
}

.result-info {
    min-width: 0;
    flex: 1;
}

.result-info h3 {
    font-size: 16px;
    margin: 0 0 10px;
    line-height: 1.3;
}

.result-location {
    color: #91879c;
    font-size: 12px;
    margin: 0 0 12px;
}

.details-link {
    color: #9b76bc;
    font-size: 13px;
    text-decoration: none;
    font-weight: 500;
}

.details-link:hover {
    text-decoration: underline;
}

.empty {
    text-align: center;
    padding: 40px 15px;
    color: #756b80;
}

@media (max-width:430px) {
    .app {
        width: 100%;
        min-height: 100vh;
        margin: 0;
        border: none;
        border-radius: 0;
    }
}
</style>
</head>

<body>
<div class="app">
    <div class="phone-notch"></div>

    <main class="content">
        <header class="header">
            <a class="back"
               href="{{ url_for('find_item') }}"
               aria-label="Back to Search">‹</a>
            <h1>Find Item Results</h1>
        </header>

        <div class="results-title" id="resultsCount">
            Results (0)
        </div>

        <section class="results-list" id="resultsList"></section>
    </main>
</div>

<script>
const sampleItems = [
    {
        id: 1,
        name: "Car Key",
        location: "Al Jubail Mall",
        category: "Keys",
        date: "2026-11-02",
        image: "https://placehold.co/200x200/f0e9f8/6a36a2?text=Car+Key"
    },
    {
        id: 2,
        name: "Purple Water Bottle",
        location: "Al Jubail Corniche",
        category: "Others",
        date: "2026-11-04",
        image: "https://placehold.co/200x200/eee0fa/6a36a2?text=Water+Bottle"
    },
    {
        id: 3,
        name: "Black Wallet",
        location: "Fanateer District",
        category: "Bags & Wallets",
        date: "2026-11-06",
        image: "https://placehold.co/200x200/e8e3ed/6a36a2?text=Wallet"
    }
];

const params = new URLSearchParams(window.location.search);
const keyword = (params.get("keyword") || "").toLowerCase().trim();
const category = params.get("category") || "";
const location = params.get("location") || "";
const from = params.get("from") || "";
const to = params.get("to") || "";

const filtered = sampleItems.filter(item => {
    const matchesKeyword =
        !keyword ||
        item.name.toLowerCase().includes(keyword);

    const matchesCategory =
        !category || item.category === category;

    const matchesLocation =
        !location ||
        item.location.toLowerCase().includes(location.toLowerCase());

    const matchesDate =
        (!from || item.date >= from) &&
        (!to || item.date <= to);

    return matchesKeyword &&
           matchesCategory &&
           matchesLocation &&
           matchesDate;
});

document.getElementById("resultsCount").textContent =
    "Results (" + filtered.length + ")";

const list = document.getElementById("resultsList");

if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No items found. Try different search filters.";
    list.appendChild(empty);
}

filtered.forEach(item => {
    const card = document.createElement("article");
    card.className = "result-card";

    const img = document.createElement("img");
    img.className = "result-image";
    img.src = item.image;
    img.alt = item.name;

    const info = document.createElement("div");
    info.className = "result-info";

    const title = document.createElement("h3");
    title.textContent = item.name;

    const place = document.createElement("p");
    place.className = "result-location";
    place.textContent = item.location;

    const link = document.createElement("a");
    link.className = "details-link";
    link.href = "#";
    link.textContent = "View Details ›";
    link.addEventListener("click", e => {
        e.preventDefault();
        alert("Item details page will be connected next.");
    });

    info.append(title, place, link);
    card.append(img, info);
    list.appendChild(card);
});
</script>
</body>
</html>
