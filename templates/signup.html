
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | LostMatch</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #f6f4fb;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.phone {
    width: 390px;
    max-width: 100%;
    background: white;
    border: 2px solid #aaa4bb;
    border-radius: 48px;
    overflow: hidden;
    position: relative;
    padding-bottom: 30px;
}

.island {
    width: 125px;
    height: 28px;
    background: #34344d;
    border-radius: 30px;
    margin: 15px auto 0;
}

.hero {
    text-align: center;
    background: #f3ebff;
    padding-top: 28px;
}

.logo-img {
    width: 85px;
    height: 85px;
    object-fit: contain;
}

h1 {
    color: #51218b;
    margin: 8px 0;
    font-size: 30px;
}

.subtitle {
    color: #40344f;
    font-size: 14px;
    margin-bottom: 15px;
}

.skyline {
    width: 100%;
    display: block;
}

.form {
    padding: 22px 25px;
}

h2 {
    text-align: center;
    color: #51218b;
    margin: 0 0 20px;
}

label {
    display: block;
    margin: 13px 0 7px;
    color: #302743;
    font-size: 14px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #ddd5ea;
    border-radius: 15px;
    font-size: 14px;
    outline-color: #8752c5;
}

.signup-btn {
    width: 100%;
    padding: 16px;
    margin-top: 25px;
    background: linear-gradient(135deg, #a56bd6, #59238d);
    color: white;
    border: none;
    border-radius: 20px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.login-link {
    text-align: center;
    margin-top: 20px;
    font-size: 14px;
}

a {
    color: #7134ae;
    font-weight: bold;
    text-decoration: none;
}

@media (max-width: 430px) {
    body { padding: 0; }
    .phone {
        width: 100%;
        min-height: 100vh;
        border-radius: 0;
        border: none;
    }
}
</style>
</head>

<body>
<div class="phone">
    <div class="island"></div>

    <section class="hero">
        <img class="logo-img"
             src="{{ url_for('static', filename='logo.png') }}"
             alt="LostMatch Logo">

        <h1>LostMatch</h1>
        <p class="subtitle">Lost & Found Across the City</p>

        <img class="skyline"
             src="{{ url_for('static', filename='skyline.png') }}"
             alt="City Skyline">
    </section>

    <form class="form" action="/signup" method="POST">
        <h2>Create Account</h2>

        <label>Full Name</label>
        <input type="text" name="name"
               placeholder="Enter your full name" required>

        <label>Email</label>
        <input type="email" name="email"
               placeholder="Enter your email" required>

        <label>Password</label>
        <input type="password" name="password"
               placeholder="Create a password"
               minlength="8" required>

        <label>Confirm Password</label>
        <input type="password" name="confirm_password"
               placeholder="Confirm your password"
               minlength="8" required>

        <button class="signup-btn" type="submit">
            Sign Up
        </button>

        <p class="login-link">
            Already have an account?
            <a href="/">Log In</a>
        </p>
    </form>
</div>
</body>
</html>
