
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LostMatch | Forgot Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f4fb;
            color: #241538;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* iPhone Frame */
        .app {
            width: 390px;
            max-width: 100%;
            min-height: 844px;
            margin: 30px auto;
            background: white;
            border: 3px solid #8b83a5;
            border-radius: 48px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        /* Dynamic Island */
        .phone-notch {
            width: 125px;
            height: 30px;
            background: #25212e;
            border-radius: 25px;
            margin: 12px auto 0;
            position: relative;
            z-index: 2;
        }

        /* Branding */
        .hero {
            background: #f3ebff;
            text-align: center;
            padding-top: 35px;
            overflow: hidden;
        }

        .brand-logo {
            width: 100px;
            height: auto;
            display: block;
            margin: 0 auto 12px;
        }

        .logo {
            color: #4b1687;
            font-size: 32px;
            font-weight: bold;
            margin: 8px 0;
        }

        .subtitle {
            font-size: 15px;
            color: #241538;
            margin: 12px 0 18px;
        }

        .city {
            width: 100%;
            margin-top: 10px;
        }

        .city img {
            display: block;
            width: 100%;
            height: auto;
        }

        /* Forgot Password Content */
        .content {
            padding: 32px 24px 45px;
            text-align: center;
        }

        .content h2 {
            color: #241538;
            font-size: 26px;
            margin: 0 0 15px;
        }

        .description {
            font-size: 14px;
            color: #756b80;
            line-height: 1.7;
            margin-bottom: 32px;
        }

        /* Form */
        .form {
            text-align: left;
        }

        .form label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .form input {
            display: block;
            width: 100%;
            height: 54px;
            padding: 0 16px;
            border: 1px solid #ded6ea;
            border-radius: 16px;
            font-size: 14px;
            outline: none;
            margin-bottom: 25px;
        }

        .form input:focus {
            border-color: #8644c4;
            box-shadow: 0 0 0 3px #eee2fa;
        }

        /* Reset Button */
        .reset-button {
            display: block;
            width: 100%;
            padding: 17px;
            background: linear-gradient(
                180deg,
                #a45bd6,
                #61249c
            );
            color: white;
            border: none;
            border-radius: 22px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .reset-button:hover {
            background: #753ab5;
        }

        /* Back to Login */
        .back-login {
            display: block;
            margin-top: 28px;
            text-align: center;
            color: #61249c;
            font-size: 14px;
            font-weight: bold;
            text-decoration: none;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        /* Status Message */
        .message {
            background: #f3edfa;
            color: #61249c;
            padding: 14px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            line-height: 1.5;
        }

        /* Mobile Screens */
        @media (max-width: 430px) {
            .app {
                width: 100%;
                margin: 0 auto;
                min-height: 100vh;
                border: none;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

    <div class="app">

        <!-- Dynamic Island -->
        <div class="phone-notch"></div>

        <!-- Branding -->
        <section class="hero">

            <img
                class="brand-logo"
                src="{{ url_for('static', filename='logo.png') }}"
                alt="LostMatch Logo"
            >

            <h1 class="logo">LostMatch</h1>

            <p class="subtitle">
                Lost &amp; Found Across the City
            </p>

            <div class="city">
                <img
                    src="{{ url_for('static', filename='skyline.png') }}"
                    alt="City Skyline"
                >
            </div>

        </section>

        <!-- Forgot Password Content -->
        <section class="content">

            <h2>Forgot Password?</h2>

            <p class="description">
                Don't worry! Enter your email address
                below and we'll help you reset your
                password.
            </p>

            {% if message %}
            <div class="message">
                {{ message }}
            </div>
            {% endif %}

            <form
                class="form"
                action="{{ url_for('forgot_password') }}"
                method="POST"
            >

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

                <button
                    class="reset-button"
                    type="submit"
                >
                    Send Reset Link
                </button>

            </form>

            <a
                class="back-login"
                href="{{ url_for('home') }}"
            >
                Back to Log In
            </a>

        </section>

    </div>

</body>
</html>
